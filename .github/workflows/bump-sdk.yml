name: Bump platform-go SDK

# Opens a PR pinning github.com/axilioai/platform-go to a newly published
# version. Fired by platform-go's tag-on-merge.yml (repository_dispatch
# platform-go-released) right after it cuts a release, so the CLI's dependency
# tracks the SDK automatically. This is the last link of the release chain:
#   platform-python regen PR -> platform-go regen PR -> platform-go release
#   -> (this) CLI bump PR
# The PR is opened, not merged: a human approves it (the third approval in the
# python -> go -> cli sequence).
#
# The PR is opened with the axilio-sdk-publisher GitHub App token, minted per
# run from Infisical via GitHub OIDC (AXI-1634, AXI-1791) — the same short-lived
# credential the rest of the SDK release chain uses. An App-token PR (unlike a
# GITHUB_TOKEN one) triggers ci.yml, so a reviewer sees the bump green before
# approving. There is deliberately no GITHUB_TOKEN fallback: a missing or
# under-scoped credential fails the job loudly rather than opening a PR nobody
# can see CI on (the failure mode AXI-1634 was created to kill).
#
# workflow_dispatch is provided for manual re-pinning to a specific version.

on:
  repository_dispatch:
    types: [platform-go-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'platform-go version to pin (e.g. v0.1.1)'
        required: true

permissions:
  contents: read
  # id-token lets the runner mint the GitHub OIDC token Infisical trusts; the
  # App installation token it returns carries the contents/pull-requests write
  # the PR needs, so the job's own GITHUB_TOKEN stays read-only.
  id-token: write

jobs:
  bump:
    name: Bump platform-go pin
    runs-on: ubuntu-latest
    env:
      SDK_PUBLISHER_LOGIN: 'axilio-sdk-publisher[bot]'
      SDK_PUBLISHER_USER_ID: '313650391'
      SDK_PUBLISHER_EMAIL: '313650391+axilio-sdk-publisher[bot]@users.noreply.github.com'
    # The sdk-bump environment pins the GitHub OIDC subject the Infisical
    # SDK-publisher identity trusts (repo:axilioai/cli:environment:sdk-bump),
    # matching its repo:axilioai/*:environment:* glob. The environment carries
    # no protection rules, so this automated job is never gated on approval.
    environment: sdk-bump
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve target version
        id: v
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${PAYLOAD_VERSION:-$INPUT_VERSION}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No version supplied"; exit 1
          fi
          # Normalise to a leading v (go get wants v-prefixed semver).
          [[ "$VERSION" == v* ]] || VERSION="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target platform-go version: $VERSION"

      - name: Bump the pin
        env:
          # direct + off: fetch straight from GitHub and skip the sum DB so the
          # bump works immediately after a release, before the module proxy /
          # checksum DB have indexed the new tag.
          GOPROXY: direct
          GOSUMDB: 'off'
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          go get "github.com/axilioai/platform-go@${VERSION}"
          go mod tidy
          go build ./...

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Pin already at ${{ steps.v.outputs.version }}; nothing to PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint SDK publisher token
        id: token
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/sdk-publisher-token
        with:
          identity-id: ${{ vars.INFISICAL_GITHUB_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          repositories: cli

      - name: Verify SDK publisher identity
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          actual_id="$(gh api "users/${SDK_PUBLISHER_LOGIN}" --jq .id)"
          if [[ "$actual_id" != "$SDK_PUBLISHER_USER_ID" ]]; then
            echo "::error::${SDK_PUBLISHER_LOGIN} has GitHub user ID ${actual_id}; expected ${SDK_PUBLISHER_USER_ID}"
            exit 1
          fi

          expected_email="${SDK_PUBLISHER_USER_ID}+${SDK_PUBLISHER_LOGIN}@users.noreply.github.com"
          if [[ "$SDK_PUBLISHER_EMAIL" != "$expected_email" ]]; then
            echo "::error::SDK publisher email does not match its durable GitHub user ID and login"
            exit 1
          fi

          if ! awk -F '\t' -v email="$SDK_PUBLISHER_EMAIL" '
            NR > 1 && $1 == email { found = 1 }
            END { exit found ? 0 : 1 }
          ' .github/git-identity-inventory.tsv; then
            echo "::error::SDK publisher email is missing from the reviewed identity inventory"
            exit 1
          fi

          .github/scripts/check-git-identities.sh \
            --policy .github/git-identity-allowlist.txt \
            --active-email "$SDK_PUBLISHER_EMAIL"

      - name: Open bump PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # The axilio-sdk-publisher App token (minted above) — an App-token PR
          # triggers ci.yml, unlike a GITHUB_TOKEN one. No fallback by design.
          token: ${{ steps.token.outputs.token }}
          # Commit as the App bot, deterministically — otherwise the author is
          # the trigger's actor (a human on workflow_dispatch, the dispatch PAT's
          # user on repository_dispatch), which is non-deterministic and trips
          # the git-identity inventory. One stable, inventoried identity instead.
          committer: "${{ env.SDK_PUBLISHER_LOGIN }} <${{ env.SDK_PUBLISHER_EMAIL }}>"
          author: "${{ env.SDK_PUBLISHER_LOGIN }} <${{ env.SDK_PUBLISHER_EMAIL }}>"
          branch: bump/platform-go
          base: main
          add-paths: |
            go.mod
            go.sum
          title: "[AXI-1252] - bump platform-go to ${{ steps.v.outputs.version }}"
          commit-message: |
            [AXI-1252] - bump platform-go to ${{ steps.v.outputs.version }}

            Auto-opened by .github/workflows/bump-sdk.yml on a new platform-go
            release. Pins github.com/axilioai/platform-go to ${{ steps.v.outputs.version }}.
          body: |
            Automated dependency bump: pins `github.com/axilioai/platform-go` to
            **${{ steps.v.outputs.version }}**, the version platform-go just
            published.

            Opened by `bump-sdk.yml` on a `platform-go-released` dispatch — the
            last link of the SDK release chain (platform-python regen ->
            platform-go regen -> platform-go release -> this). `go mod tidy` +
            `go build ./...` passed in the workflow before this PR was opened.

            Approve + merge to ship the CLI against the new SDK.
