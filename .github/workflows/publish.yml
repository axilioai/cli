name: Publish CLI

# The one workflow that ships the CLI to users — the CLI's equivalent of the
# monorepo's deploy orchestrator. There is no staging/prod deployment for a
# client binary: "production" is the latest GitHub Release, because that is
# what install.sh and the Homebrew tap resolve (environment selection is a
# runtime concern — every released binary can point at prod or staging via
# --base-url/config).
#
# Publishing = converging VERSION -> tag -> release:
#
#   1. Fires when a push to main moves the VERSION file (i.e. a feature PR
#      carried a version bump — the bump is reviewed as part of the diff, and
#      the merge is the publish action). CI quality + cross-compile gates run
#      on the PR via ci.yml before any of this.
#   2. `tag` reads + validates VERSION and pushes the annotated vX.Y.Z tag at
#      the merge commit. Idempotent: an existing tag is left alone, so a
#      docs-only PR can touch VERSION without re-tagging.
#   3. `release` checks both the GitHub assets and generated Homebrew cask,
#      then runs goreleaser AT THE TAG when either side is incomplete. Recovery
#      rebuilds assets and cask together so the cask hashes match the artifacts.
#
# The release gate is idempotent when both destinations are current. If either
# side is incomplete, a re-run replaces the GoReleaser-owned assets and updates
# the cask as one consistent set. workflow_dispatch is the manual recovery entry.
#
# Everything happens inside this one workflow run — no tag-push event chaining.
# That is deliberate: tags pushed with the default GITHUB_TOKEN never trigger
# other workflows (GitHub's recursion guard), which is why the previous
# design (a separate tag-triggered Release workflow) could not be driven by
# automation without a bot PAT.
#
# The pattern is the CLI-shaped version of platform-python/platform-go's
# VERSION + tag-on-merge release flow; the CLI is the last link of that SDK
# release chain (see bump-sdk.yml), so nothing dispatches downstream.

on:
  push:
    branches: [main]
    paths:
      - VERSION
  # Manual entry: re-run a failed publish, or publish the current VERSION if
  # a merge somehow skipped it. Converges to the same end state.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Tag vX.Y.Z from VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release identity policy
        run: |
          git config user.name "axilio-bot"
          git config user.email "bot@axilio.ai"
          .github/scripts/check-git-identities.sh \
            --policy .github/git-identity-allowlist.txt \
            --rev HEAD \
            --active-email "$(git config user.email)"

      - name: Read version from VERSION
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::VERSION file is empty"; exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION '$VERSION' is not a SemVer version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Read version: $VERSION"

      - name: Push tag (idempotent)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} already exists on origin; leaving it alone"
            exit 0
          fi
          git tag -a "${TAG}" -m "axilio CLI ${VERSION}"
          git push origin "${TAG}"
          echo "pushed ${TAG} at $(git rev-parse HEAD)"

  release:
    name: goreleaser at the tag
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release and cask state
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          TAG="v${VERSION}"
          RELEASE_ASSETS="${RUNNER_TEMP}/axilio-release-assets"
          RELEASE_CHECKSUMS="${RUNNER_TEMP}/axilio-release-checksums"
          CASK="${RUNNER_TEMP}/axilio.rb"

          release_current=false
          if gh release view "${TAG}" --json assets --jq '.assets[].name' > "${RELEASE_ASSETS}" 2>/dev/null; then
            release_current=true
            for asset in \
              "axilio_${VERSION}_darwin_amd64.tar.gz" \
              "axilio_${VERSION}_darwin_arm64.tar.gz" \
              "axilio_${VERSION}_linux_amd64.tar.gz" \
              "axilio_${VERSION}_linux_arm64.tar.gz" \
              "axilio_${VERSION}_windows_amd64.zip" \
              "axilio_${VERSION}_windows_arm64.zip" \
              "checksums.txt"; do
              if ! grep -Fqx "${asset}" "${RELEASE_ASSETS}"; then
                release_current=false
              fi
            done
          fi

          cask_current=false
          version_without_build="${VERSION%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            # skip_upload: auto deliberately omits prereleases from the tap.
            cask_current=true
          elif gh api repos/axilioai/homebrew-tap/contents/Casks/axilio.rb --jq .content 2>/dev/null | base64 --decode > "${CASK}"; then
            if grep -Fqx "  version \"${VERSION}\"" "${CASK}" && \
              grep -Fqx '  manpage "man/axilio.1"' "${CASK}" && \
              gh release download "${TAG}" --pattern checksums.txt --output "${RELEASE_CHECKSUMS}"; then
              cask_current=true
              for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
                asset="axilio_${VERSION}_${target}.tar.gz"
                release_sha=$(awk -v asset="${asset}" '$2 == asset { print $1; exit }' "${RELEASE_CHECKSUMS}")
                cask_sha=$(awk -v target="${target}.tar.gz" '
                  $1 == "sha256" { hash=$2; gsub(/"/, "", hash) }
                  index($0, target) { print hash; exit }
                ' "${CASK}")
                if [[ -z "${release_sha}" || "${cask_sha}" != "${release_sha}" ]]; then
                  cask_current=false
                fi
              done
            fi
          fi

          if [[ "${release_current}" == true && "${cask_current}" == true ]]; then
            echo "release ${TAG} and its expected Homebrew state are current; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_current=${release_current}; cask_current=${cask_current}; converging"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail before release creation when this run needs a stable cask but has
      # no tap credential. The state check above makes later failures rerunnable.
      - name: Require Homebrew tap token for stable release
        if: steps.gate.outputs.publish == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          version_without_build="${VERSION%%+*}"
          case "${version_without_build}" in
            *-*) exit 0 ;;
          esac
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for stable CLI releases"
            exit 1
          fi

      - name: Check out the tag
        # goreleaser derives the version from the tag on HEAD, and a manual
        # dispatch may run after main has moved past the tagged commit — so
        # always build exactly what was tagged, not whatever HEAD is.
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          git fetch --tags origin
          git checkout "v${VERSION}"

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          go-version-file: go.mod

      # GoReleaser's before hook checks byte-for-byte generation drift and
      # requires mandoc -Tlint to produce no diagnostics. Install mandoc here
      # so publication cannot race ahead of the ordinary CI workflow.
      - name: Install manpage linter
        if: steps.gate.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mandoc

      - uses: goreleaser/goreleaser-action@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for stable releases; skip_upload: auto skips prereleases.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
