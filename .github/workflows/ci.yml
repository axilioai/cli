name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # gofmt + vet + golangci-lint + race tests. The single source of truth for
  # "is the code healthy".
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install documentation tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mandoc shellcheck
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Build golangci-lint from source with this repo's Go toolchain
          # (go.mod pins a very new Go). A prebuilt binary compiled against an
          # older Go can't parse newer source; goinstall sidesteps that.
          install-mode: goinstall
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh scripts/testdata/install/*
      - name: generated manpage
        run: sh scripts/check_manpage.sh
      - name: installer fixtures
        run: sh scripts/test_install.sh
      - name: test (race)
        # TEMPORARY: prod (api.axilio.ai) predates the /skill route
        # (AXI-1527) and 404s TestMain's skill fetch; staging serves it.
        # Remove this env once the prod backend deploy lands.
        env:
          AXILIO_BASE_URL: https://staging-api.axilio.ai
        run: go test -race ./...

  # The quality job runs on Linux. Windows differs in paths, file modes,
  # executable lookup and shells, so run the whole suite there too. -race needs
  # cgo, so it stays on the Linux job.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        # Same TEMPORARY staging override as the quality job.
        env:
          AXILIO_BASE_URL: https://staging-api.axilio.ai
        run: go test ./...

  # Run install.ps1 for real, the way users do (`irm ... | iex`), against a
  # published release in both Windows PowerShell 5.1 and PowerShell 7. One leg
  # pins VERSION without the leading v; the other resolves the latest release.
  install-ps1:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            version: "0.11.0"
          - shell: pwsh
            version: ""
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      # The runner context is not available in job-level env.
      - name: choose an install directory
        run: Add-Content -Path $env:GITHUB_ENV -Value "INSTALL_DIR=$env:RUNNER_TEMP\axilio\bin"
      - name: PSScriptAnalyzer
        if: matrix.shell == 'pwsh'
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          # Write-Host is deliberate: installer progress is for the console,
          # not the pipeline.
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          if ($findings) { $findings | Format-Table -AutoSize | Out-String -Width 200; exit 1 }
      - name: install through iex
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          $exe = Join-Path $env:INSTALL_DIR 'axilio.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "axilio --version exited $LASTEXITCODE" }
          if ($env:VERSION -and -not ((& $exe --version) -match [regex]::Escape($env:VERSION))) { throw 'installed the wrong version' }
          if (-not (Test-Path (Join-Path $env:INSTALL_DIR 'man\axilio.1.html'))) { throw 'HTML manual missing' }
          if (Get-Command Fail -ErrorAction SilentlyContinue) { throw 'install.ps1 leaked its functions into the caller scope' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -notcontains $env:INSTALL_DIR) { throw "install dir is not on the user PATH: $userPath" }
      - name: reinstall over an existing install
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $entries = @(($userPath -split ';') | Where-Object { $_ -eq $env:INSTALL_DIR })
          if ($entries.Count -ne 1) { throw "expected one PATH entry, found $($entries.Count): $userPath" }
          if (Test-Path (Join-Path $env:INSTALL_DIR '.axilio.exe.old')) { throw 'the replaced binary was left behind' }
          axilio --version
          if ($LASTEXITCODE -ne 0) { throw "axilio on PATH exited $LASTEXITCODE" }

  # Prove every release target builds before goreleaser ever runs, so a tag
  # never fails on a platform we don't build locally.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/axilio

  # Exercise the actual GoReleaser v2 pipeline and inspect every package. This
  # catches archive/cask drift that six bare cross-compiles cannot see. Six
  # cross-builds plus a package audit is too costly for every PR push, so it
  # runs on main. When a PR touches .goreleaser.yaml, install.sh, man/, or
  # scripts/, run it locally first:
  #   goreleaser release --snapshot --clean && sh scripts/test_release_artifacts.sh
  release-artifacts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mandoc ruby unzip
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect release archives and generated cask
        run: sh scripts/test_release_artifacts.sh
